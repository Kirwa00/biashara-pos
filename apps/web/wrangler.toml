# Web app: the built SPA as Workers static assets, with /v1 forwarded to kenya-pos-api over a service binding.
# Deploy the API first, then `npm run build && npx wrangler deploy` here.
name = "kenya-pos-web"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true # the old address stays up so tills can sync queued offline sales after the move
routes = [
  { pattern = "biasharapos.com", custom_domain = true },
  { pattern = "www.biasharapos.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true # every request, so www can redirect on any path

[[services]]
binding = "API"
service = "kenya-pos-api"

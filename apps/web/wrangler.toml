# Web app: the built SPA served as Workers static assets. Deploy with `npm run build && npx wrangler deploy` from apps/web.
# The SPA calls /v1 on its own origin: add a Workers route app.<domain>/v1/* -> kenya-pos-api. Security headers: public/_headers.
name = "kenya-pos-web"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

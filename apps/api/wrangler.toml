name = "kenya-pos-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"

# Production: bind Hyperdrive (query caching DISABLED — stock/payments must never read stale rows).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"
# Local dev: put DATABASE_URL and JWT_SECRET in .dev.vars (see .dev.vars.example).

# Sprint 8 alerts (UTC). Jobs are idempotent per Nairobi day, so a retried or overlapping run sends nothing twice.
# 05:00 = 08:00 EAT low stock, overdue, M-Pesa issues, POs, eTIMS issues; 17:00 = 20:00 EAT daily owner summary; */15 eTIMS submission queue.
# Owner email needs `wrangler secret put RESEND_API_KEY` and EMAIL_FROM (a Resend-verified sender); without them alerts stay in-app.
[triggers]
crons = ["0 5 * * *", "0 17 * * *", "*/15 * * * *"]
